[env:lolin32]
platform = espressif32
board = lolin32
framework = arduino
monitor_speed = 115200
lib_archive = false

; Bluepad32-enabled Arduino framework (includes BT gamepad support)
; See: https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases
platform_packages =
    framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip

; Large app partition — BT stack needs extra flash
board_build.partitions = huge_app.csv

lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
